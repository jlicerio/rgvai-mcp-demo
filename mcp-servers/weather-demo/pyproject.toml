[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-weather-demo-server"
version = "0.1.0"
description = "MCP server for weather-demo (CLI application, with 6 capabilities)"
authors = [
    { name = "Type-MCP", email = "typemcp@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "mcp>=1.0",
]

[project.urls]
Homepage = "https://github.com/Type-MCP/mcp-anything"
Repository = "https://github.com/Type-MCP/mcp-anything"

[project.scripts]
mcp-weather-demo = "mcp_weather_demo.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_weather_demo"]

